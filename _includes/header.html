<header class="site-header">
  <nav class="wrap header-inner" aria-label="Site">
    <a class="site-name" href="{{ '/' | relative_url }}">
      {{- site.data.profile.name_romanized | default: site.title -}}
    </a>
    <ul class="nav-list">
      {%- for item in site.nav %}
      <li>
        <a href="{{ item.url | relative_url }}"
          {%- if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      </li>
      {%- endfor %}
    </ul>
  </nav>
</header>
